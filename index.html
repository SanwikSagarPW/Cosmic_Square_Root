<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Cosmic Square Root</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="preload" href="Build/Asteroid_destroyer.loader.js" as="script">
    <link rel="preload" href="Build/Asteroid_destroyer.framework.js" as="script">
    <link rel="preload" href="Build/Asteroid_destroyer.data" as="fetch" crossorigin>
    <link rel="preload" href="Build/Asteroid_destroyer.wasm" as="fetch" crossorigin>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        background: #000;
        width: 100%; height: 100%;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }

      #unity-container {
        width: 100vw; height: 100vh;
        display: flex; justify-content: center; align-items: center;
      }

      #unity-canvas { background: #000; }

      #loading-overlay {
        position: fixed; inset: 0;
        background: #000;
        display: flex; flex-direction: column;
        justify-content: center; align-items: center;
        gap: 12px; z-index: 99;
      }

      #loading-bar-wrap {
        width: min(300px, 60vw);
        height: 6px;
        background: rgba(255,255,255,0.12);
        border-radius: 3px;
        overflow: hidden;
      }

      #loading-bar {
        height: 100%; width: 0%;
        background: linear-gradient(90deg, #667eea, #764ba2);
        border-radius: 3px;
        transition: width 0.25s ease;
      }

      #loading-pct {
        color: rgba(255,255,255,0.5);
        font-size: 13px;
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <div id="loading-overlay">
      <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
      <div id="loading-pct">0%</div>
    </div>

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }

      var container = document.getElementById('unity-container');
      var canvas    = document.getElementById('unity-canvas');
      var overlay   = document.getElementById('loading-overlay');
      var bar       = document.getElementById('loading-bar');
      var pct       = document.getElementById('loading-pct');

      function applyLetterboxing() {
        var isPortrait = window.matchMedia("(orientation: portrait)").matches;
        var ratio = isPortrait ? 9/16 : 16/9;
        var cw = container.offsetWidth, ch = container.offsetHeight;
        var w, h;
        if (cw / ch > ratio) { h = ch; w = h * ratio; }
        else                  { w = cw; h = w / ratio; }
        w = Math.round(w); h = Math.round(h);
        canvas.style.width  = w + 'px';
        canvas.style.height = h + 'px';
        var dpr = window.devicePixelRatio || 1;
        canvas.width  = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
      }

      window.addEventListener('resize', applyLetterboxing);
      window.addEventListener('orientationchange', applyLetterboxing);
      document.addEventListener('fullscreenchange', function() {
        setTimeout(applyLetterboxing, 150);
      });
      applyLetterboxing();

      document.addEventListener('click', function goFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(function(){});
        }
        document.removeEventListener('click', goFullscreen);
      }, { once: true });

      var buildUrl = "Build";
      var config = {
        dataUrl:            buildUrl + "/Asteroid_destroyer.data",
        frameworkUrl:       buildUrl + "/Asteroid_destroyer.framework.js",
        codeUrl:            buildUrl + "/Asteroid_destroyer.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName:        "DefaultCompany",
        productName:        "AstroidDestroyer",
        productVersion:     "1.1",
      };

      var script = document.createElement('script');
      script.src = buildUrl + "/Asteroid_destroyer.loader.js";
      script.onload = function() {
        createUnityInstance(canvas, config, function(p) {
          var v = Math.round(p * 100);
          bar.style.width = v + '%';
          pct.textContent = v + '%';
        }).then(function() {
          overlay.style.display = 'none';
        }).catch(function(msg) {
          alert(msg);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
