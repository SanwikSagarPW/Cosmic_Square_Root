<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | AstroidDestroyer</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="preload" href="Build/Asteroid_destroyer.loader.js" as="script">
    <link rel="preload" href="Build/Asteroid_destroyer.framework.js" as="script">
    <link rel="preload" href="Build/Asteroid_destroyer.data" as="fetch" crossorigin>
    <link rel="preload" href="Build/Asteroid_destroyer.wasm" as="fetch" crossorigin>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;700&display=swap');
      
      * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
      }
      
      html, body {
          background: #000; /* Black background for letterboxing */
          font-family: 'Roboto', sans-serif;
          overflow: hidden;
          width: 100%;
          height: 100%;
      }

      #page-container {
          width: 100vw;
          height: 100vh;
          display: flex;
          flex-direction: column;
          background: linear-gradient(135deg, rgba(0, 0, 0, 1) 0%, rgba(0.1,0.1, 0.1, 0.5) 100%);
      }
      
      #controls {
          display: none;
      }
      
      .title-section { display: flex; align-items: center; gap: clamp(8px, 2vw, 20px); }
      
      .game-logo {
          width: clamp(28px, 4vw, 40px);
          height: clamp(28px, 4vw, 40px);
          background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
          border-radius: clamp(6px, 1vw, 10px);
          display: flex; align-items: center;
          justify-content: center;
          font-size: clamp(18px, 3vw, 24px);
          color: white;
          box-shadow: 0 4px 10px rgba(0, 0, 0, 1);
      }
      
      .game-title {
          color: white; font-family: 'Bebas Neue', cursive;
          font-size: clamp(18px, 3vw, 32px);
          letter-spacing: clamp(1px, 0.2vw, 3px);
          text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      }
      
      .btn-group { display: flex; gap: clamp(6px, 1.5vw, 15px); align-items: center; flex-wrap: nowrap; }
      
      button {
          background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
          color: white; border: none;
          padding: clamp(5px, 1vh, 10px) clamp(8px, 2vw, 18px);
          border-radius: clamp(15px, 2.5vw, 25px);
          cursor: pointer;
          font-size: clamp(10px, 1.5vw, 14px);
          font-weight: 600; text-transform: uppercase;
          letter-spacing: clamp(0.3px, 0.08vw, 1px);
          transition: all 0.3s ease;
          box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
          display: flex; align-items: center;
          white-space: nowrap;
      }
      
      button:hover {
          transform: translateY(-2px);
          box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
      }
      
      .btn-secondary {
          background: rgba(255, 255, 255, 0.1);
          border: 2px solid rgba(255, 255, 255, 0.3);
          box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      }
      
      .btn-secondary:hover { background: rgba(255, 255, 255, 0.2); }
      .icon { font-size: clamp(10px, 1.5vw, 16px); margin-right: clamp(3px, 0.8vw, 8px); }

      #unity-container {
        flex: 1;
        min-height: 0;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      
      #unity-canvas {
        background: #000;
      }

      #loading-overlay {
          position: fixed; top: 0; left: 0;
          width: 100%; height: 100%;
          background: #000;
          display: flex; flex-direction: column;
          justify-content: center; align-items: center;
          z-index: 99; gap: 24px;
      }

      #loading-logo {
          font-size: 56px;
          animation: pulse 1.5s ease-in-out infinite;
      }

      @keyframes pulse {
          0%, 100% { transform: scale(1); opacity: 1; }
          50% { transform: scale(1.1); opacity: 0.7; }
      }

      #loading-title {
          font-family: 'Bebas Neue', cursive;
          font-size: clamp(24px, 5vw, 42px);
          color: #fff;
          letter-spacing: 3px;
      }

      #loading-bar-container {
          width: clamp(200px, 50vw, 400px);
          height: 8px;
          background: rgba(255,255,255,0.15);
          border-radius: 4px;
          overflow: hidden;
      }

      #loading-bar {
          height: 100%;
          width: 0%;
          background: linear-gradient(90deg, #667eea, #764ba2);
          border-radius: 4px;
          transition: width 0.3s ease;
      }

      #loading-text {
          font-family: 'Roboto', sans-serif;
          font-size: clamp(12px, 2vw, 16px);
          color: rgba(255,255,255,0.6);
          letter-spacing: 1px;
      }

      #loading-status {
          font-family: 'Roboto', sans-serif;
          font-size: clamp(10px, 1.5vw, 13px);
          color: rgba(255,255,255,0.35);
      }
    </style>
  </head>
  <body>
    <div id="page-container">
      <div id="controls">
          <div class="title-section">
              <div class="game-logo">🚀</div>
              <h1 class="game-title">Cosmic Multiplication</h1>
          </div>
          <div class="btn-group">
              <button id="fullscreen-button" onclick="toggleFullscreen()">
                  <span class="icon">⛶</span><span>Fullscreen</span>
              </button>
              <button class="btn-secondary" onclick="restartGame()">
                  <span class="icon">🔄</span><span>Restart</span>
              </button>
          </div>
      </div>

      <div id="unity-container">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
      </div>
    </div>

    <div id="loading-overlay">
      <div id="loading-logo">🌌</div>
      <div id="loading-title">Cosmic Square Root</div>
      <div id="loading-bar-container">
        <div id="loading-bar"></div>
      </div>
      <div id="loading-text">Loading... 0%</div>
      <div id="loading-status">Preparing game assets...</div>
    </div>
    
    <script>
      // Register service worker for caching large build files
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }

      var pageContainer = document.querySelector("#page-container");
      var unityContainer = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingOverlay = document.querySelector("#loading-overlay");
      var loadingText = document.querySelector("#loading-text");
      var loadingBar = document.querySelector("#loading-bar");
      var loadingStatus = document.querySelector("#loading-status");

      // Check if assets are cached for better status message
      if ('caches' in window) {
        caches.has('cosmic-square-root-v1').then((hasCached) => {
          if (hasCached && loadingStatus) {
            loadingStatus.textContent = 'Loading from cache — this will be fast!';
          }
        });
      }

      function toggleFullscreen() {
          if (!document.fullscreenElement) {
              pageContainer.requestFullscreen().catch(err => {
                  alert(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
              });
          } else {
              document.exitFullscreen();
          }
      }

      function restartGame() {
          location.reload();
      }

      // --- [FINAL UNIVERSAL DYNAMIC] SCALING LOGIC ---
      function applyLetterboxing() {
          // Use the reliable CSS media query to check orientation.
          const isPortrait = window.matchMedia("(orientation: portrait)").matches;
          const targetAspectRatio = isPortrait ? (9 / 16) : (16 / 9);

          let containerWidth = unityContainer.offsetWidth;
          let containerHeight = unityContainer.offsetHeight;
          let containerAspectRatio = containerWidth / containerHeight;
          
          let newWidth, newHeight;
          
          if (containerAspectRatio > targetAspectRatio) {
              newHeight = containerHeight;
              newWidth = newHeight * targetAspectRatio;
          } else {
              newWidth = containerWidth;
              newHeight = newWidth / targetAspectRatio;
          }

          // Round the final CSS size to prevent resize feedback loops.
          const finalWidth = Math.round(newWidth);
          const finalHeight = Math.round(newHeight);
          
          canvas.style.width = finalWidth + 'px';
          canvas.style.height = finalHeight + 'px';

          // Apply a DYNAMIC internal resolution for ALL devices.
          // This ensures sharpness and correct scaling on any screen.
          const dpr = window.devicePixelRatio || 1;
          canvas.width = Math.round(finalWidth * dpr);
          canvas.height = Math.round(finalHeight * dpr);
      }

      window.addEventListener('resize', applyLetterboxing);
      window.addEventListener('orientationchange', applyLetterboxing);

      function unityShowBanner(msg, type) {
        var div = document.createElement('div');
        div.innerHTML = msg;
        div.style.position = 'absolute';
        div.style.top = '10px';
        div.style.left = '10px';
        div.style.padding = '10px';
        div.style.color = 'white';
        if (type == 'error') {
            div.style.background = 'red';
        } else if (type == 'warning') {
            div.style.background = 'yellow';
            div.style.color = 'black';
        } else {
            div.style.background = 'rgba(0,0,0,0.5)';
        }
        pageContainer.appendChild(div);
        if (type != 'error') {
          setTimeout(function() {
            pageContainer.removeChild(div);
          }, 5000);
        }
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Asteroid_destroyer.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Asteroid_destroyer.data",
        frameworkUrl: buildUrl + "/Asteroid_destroyer.framework.js",
        codeUrl: buildUrl + "/Asteroid_destroyer.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "AstroidDestroyer",
        productVersion: "1.1",
        showBanner: unityShowBanner,
      };


      var meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.getElementsByTagName('head')[0].appendChild(meta);

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          const pct = Math.round(progress * 100);
          loadingText.innerHTML = `Loading... ${pct}%`;
          loadingBar.style.width = pct + '%';
          if (pct >= 100 && loadingStatus) loadingStatus.textContent = 'Starting game...';
        }).then((unityInstance) => {
          loadingOverlay.style.display = 'none';
        }).catch((message) => {
          alert(message);
        });
      };
      
      // Auto-enter fullscreen on page load
      document.addEventListener('click', function enterFullscreen() {
          if (!document.fullscreenElement) {
              pageContainer.requestFullscreen().catch(err => {
                  console.log('Fullscreen request failed:', err);
              });
          }
          document.removeEventListener('click', enterFullscreen);
      }, { once: true });

      document.addEventListener('fullscreenchange', () => {
          setTimeout(applyLetterboxing, 150); 
      });

      applyLetterboxing(); 
      document.body.appendChild(script);
    </script>
  </body>
</html>
